name: DDK Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One broken KMI must not hide the result of the others.
      fail-fast: false
      matrix:
        # Every KMI that the DDK publishes. The module also supports older
        # kernels (4.14+), but DDK images only start at GKI 5.10.
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18

    container:
      # The image exports KDIR, ARCH=arm64, LLVM=1, CROSS_COMPILE and the
      # matching Clang in PATH, which is exactly what kernel/Makefile expects.
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The module version is the commit count (see kernel/Makefile), so
          # the full history is needed for a meaningful FAS_VERSION.
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show toolchain
        run: |
          echo "KMI:    ${{ matrix.kmi }}"
          echo "KDIR:   $KDIR"
          echo "ARCH:   $ARCH"
          echo "Cores:  $(nproc)"
          clang --version | head -1
          ld.lld --version

      - name: Build module
        run: make -C kernel -j"$(nproc)"

      - name: Package
        run: |
          kmi="${{ matrix.kmi }}"
          ko=kernel/encore_fas.ko

          test -f "$ko" || { echo "::error::$ko was not produced"; exit 1; }

          # GKI checksums change between vendor builds, so only the debug info
          # is removed here; the symbols stay for the daemon to inspect.
          llvm-strip -d "$ko"

          machine=$(llvm-readelf -h "$ko" | awk -F: '/Machine/ { gsub(/^ +/, "", $2); print $2 }')
          echo "Machine: $machine"
          [ "$machine" = "AArch64" ] || { echo "::error::$ko is not an AArch64 module"; exit 1; }

          vermagic=$(tr -c '[:print:]' '\n' < "$ko" | grep '^vermagic=' | head -1)
          echo "Vermagic: $vermagic"

          mkdir -p out
          cp "$ko" "out/encore_fas-$kmi.ko"
          echo "Size: $(du -h "out/encore_fas-$kmi.ko" | cut -f1)"
          sha256sum "out/encore_fas-$kmi.ko"

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: encore_fas-${{ matrix.kmi }}
          path: out/encore_fas-${{ matrix.kmi }}.ko
          if-no-files-found: error
          retention-days: 14

  fas_ctl:
    name: Build fas_ctl
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate NDK
        id: ndk
        run: |
          # GitHub-hosted runners preinstall the NDK; the variable name has
          # changed over time, so fall back to the newest tree in the SDK.
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ndk" ] && [ -n "${ANDROID_HOME:-}" ]; then
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          test -x "$ndk/ndk-build" || { echo "::error::no NDK found"; exit 1; }
          echo "Using NDK: $ndk"
          grep -h 'Pkg.Revision' "$ndk/source.properties" || true
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"

      - name: Build fas_ctl
        env:
          NDK: ${{ steps.ndk.outputs.ndk }}
        run: |
          # userspace_test is the ndk-build project root; jni/ holds the
          # Android.mk. The --export-dynamic flag in Android.mk keeps
          # fas_probe_frame in the dynamic symbol table for `selftest`.
          cd userspace_test
          "$NDK/ndk-build" NDK_PROJECT_PATH=. -j"$(nproc)"

          bin=libs/arm64-v8a/fas_ctl
          test -f "$bin" || { echo "::error::$bin was not produced"; exit 1; }

          echo "Machine: $(readelf -h "$bin" | awk -F: '/Machine/ { gsub(/^ +/, "", $2); print $2 }')"
          readelf --dyn-syms "$bin" | grep -q fas_probe_frame ||
            { echo "::error::fas_probe_frame is not exported; selftest will fail"; exit 1; }
          echo "Size: $(du -h "$bin" | cut -f1)"
          sha256sum "$bin"

      - name: Upload fas_ctl
        uses: actions/upload-artifact@v4
        with:
          name: fas_ctl
          path: userspace_test/libs/arm64-v8a/fas_ctl
          if-no-files-found: error
          retention-days: 14
